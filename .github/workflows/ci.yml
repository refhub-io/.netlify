name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Syntax check and tests
    runs-on: ubuntu-latest
    env:
      # Placeholders from CONTRIBUTING.md: the suite mocks Supabase and never needs real credentials.
      SUPABASE_URL: http://localhost
      SUPABASE_SERVICE_ROLE_KEY: dummy
      REFHUB_API_KEY_PEPPER: dummy
      REFHUB_API_AUDIT_DISABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Netlify's current default runtime for functions; change it if the site pins another version.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Test
        run: npm test
